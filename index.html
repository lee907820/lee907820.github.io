<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Github web page</title>
        <style>
            /* 버튼을 예쁘게 꾸미는 CSS 스타일 */
            .wiki-btn {
                display: inline-block;
                padding: 12px 24px;
                background-color: #24292e; /* 깃허브 다크 스타일 색상 */
                color: white;
                text-decoration: none;
                font-weight: bold;
                border-radius: 6px;
                transition: background-color 0.2s;
                margin-top: 20px;
            }
            .wiki-btn:hover {
                background-color: #0366d6; /* 마우스 올렸을 때 파란색으로 변경 */
            }
        </style>
    </head>
    <body>
        <h1>Hello!</h1>
        <h3>Welcome to my homepage</h3>
        <p>프로젝트의 상세한 문서와 가이드는 아래 위키에서 확인하실 수 있습니다.</p>

        <!-- 깃허브 위키로 이동하는 버튼 링크 -->
        <a href="https://github.com/lee907820/lee907820.io/wiki" class="wiki-btn" target="_blank">
            📖 프로젝트 위키 바로가기
        </a>
    </body>
</html>
